outputs:

  - name: catalogs

    type: array

    description: List of Unity Catalog catalogs.

    required: true

    items:

      type: object

      properties:

        name:
          type: string
          description: Catalog name

        comment:
          type: string
          description: Catalog description

        owner:
          type: string
          description: Catalog owner

        created_at:
          type: string
          format: date-time
          description: Creation timestamp

        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
